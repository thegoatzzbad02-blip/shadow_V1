<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow - Usuario</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/48/shield.png">
</head>
<body>
    <div class="container">
        <h1>SHADOW · USUARIO</h1>
        <button id="logoutBtn">Cerrar sesión</button>

        <div id="profile">
            <p><strong>Usuario:</strong> <span id="username"></span></p>
            <p><strong>Créditos disponibles:</strong> <span id="credits"></span></p>
        </div>

        <h2>Productos Disponibles</h2>
        <div id="products" class="products-grid"></div>

        <!-- Modal -->
        <div id="codeModal" class="modal">
            <div class="modal-content">
                <span id="closeModal" class="close">&times;</span>
                <h2>🎉 ¡Compra exitosa!</h2>
                <p class="modal-message">Tu código es:</p>
                <div class="code-box" id="purchasedCode">CÓDIGO</div>
                <p class="remaining" id="remainingCredits"></p>
                <button class="copy-btn" onclick="copyCode()">📋 Copiar código</button>
            </div>
        </div>

        <footer class="footer">
            <div class="footer-banner">
                <a href="https://t.me/Shadow_ccs_Web" target="_blank">
                    <img src="imagenes/bannerFOOTER.png" alt="Canal de Telegram" loading="lazy">
                </a>
            </div>
            <div class="footer-content">
            
                <a href="creditos.html" class="btn-creditos">⚡ Adquirir créditos</a>
            </div>
        </footer>
    </div>
    <script src="js/user.js"></script>
</body>
</html>
