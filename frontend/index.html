<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/48/shield.png">
</head>
<body>
    <div class="container">
        <h1>SHADOW</h1>
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Usuario" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
        <p id="message"></p>
        <footer class="footer">
            <div class="footer-banner">
                <a href="https://t.me/SHADOWTEAM" target="_blank">
                    <img src="imagenes/footer-banner" alt="Canal de Telegram" loading="lazy">
                </a>
            </div>
            <div class="footer-content">
               
                <a href="creditos.html" class="btn-creditos">⚡ Adquirir créditos</a>
            </div>
        </footer>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
