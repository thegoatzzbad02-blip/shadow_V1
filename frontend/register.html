<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nix Sphere · Registrarse</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

    <div class="auth-container">

        <!-- ===== LOGO PROMINENTE ===== -->
        <div class="auth-logo">
            <div class="auth-logo-icon">
                <i class="fas fa-circle-nodes"></i>
            </div>
            <h1 class="auth-logo-text">Nix Sphere</h1>
            <p class="auth-logo-slogan">Únete a nuestra comunidad</p>
        </div>

        <!-- ===== TARJETA DE REGISTRO ===== -->
        <div class="auth-card">
            <div class="auth-header">
                <h2>Crear cuenta</h2>
                <p class="auth-subtitle">Completa tus datos para registrarte</p>
            </div>

            <!-- Formulario de registro -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="regUsername"><i class="fas fa-user"></i> Usuario</label>
                    <input type="text" id="regUsername" placeholder="Elige un nombre de usuario" required />
                </div>

                <div class="form-group">
                    <label for="regEmail"><i class="fas fa-envelope"></i> Correo electrónico</label>
                    <input type="email" id="regEmail" placeholder="tu@email.com" required />
                </div>

                <div class="form-group">
                    <label for="regPassword"><i class="fas fa-lock"></i> Contraseña</label>
                    <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required />
                </div>

                <div class="form-group">
                    <label for="regConfirmPassword"><i class="fas fa-check-circle"></i> Confirmar contraseña</label>
                    <input type="password" id="regConfirmPassword" placeholder="Repite tu contraseña" required />
                </div>

                <button type="submit" class="auth-btn">
                    <i class="fas fa-user-plus"></i> Registrarse
                </button>

                <div id="registerMessage" class="auth-message"></div>
            </form>

            <div class="auth-footer">
                <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
            </div>
        </div>

        <!-- ===== BURBUJAS PROMOCIONALES ===== -->
        <div class="auth-bubbles">
            <a href="creditos.html" class="auth-bubble bubble-credits">
                <i class="fas fa-coins"></i>
                <span>Comprar créditos</span>
                <small>Recarga al instante</small>
            </a>
            <a href="user.html?category=ofertas" class="auth-bubble bubble-offers">
                <i class="fas fa-tags"></i>
                <span>Ofertas especiales</span>
                <small>Descuentos exclusivos</small>
            </a>
            <a href="user.html?category=giftcards" class="auth-bubble bubble-giftcards">
                <i class="fas fa-gift"></i>
                <span>Gift cards destacadas</span>
                <small>Las más populares</small>
            </a>
        </div>

        <!-- ===== FOOTER ===== -->
        <footer class="auth-footer-bottom">
            <div class="auth-footer-social">
                <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" aria-label="Telegram"><i class="fab fa-telegram-plane"></i></a>
            </div>
            <p class="auth-copyright">
                <i class="far fa-copyright"></i> 2025 Nix Sphere · Todos los derechos reservados
            </p>
        </footer>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
